<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0" stop-color="#2f5584"/>
      <stop offset="1" stop-color="#091320"/>
    </radialGradient>
    <!-- 동전 앞면: 왼쪽 위에서 강한 빛, 가장자리로 갈수록 어둡게 -->
    <radialGradient id="face" cx="0.34" cy="0.27" r="0.9">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="0.22" stop-color="#f3cb67"/>
      <stop offset="0.62" stop-color="#bf8a2e"/>
      <stop offset="1" stop-color="#6e430e"/>
    </radialGradient>
    <!-- 안쪽 바탕면: 테두리보다 살짝 낮고 어둡게 -->
    <radialGradient id="field" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2205" stop-opacity="0.28"/>
    </radialGradient>
    <!-- 동전 두께(옆면) -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4310"/>
      <stop offset="0.35" stop-color="#a87526"/>
      <stop offset="1" stop-color="#3a2205"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d9"/>
      <stop offset="0.45" stop-color="#d6a645"/>
      <stop offset="1" stop-color="#4f300a"/>
    </linearGradient>
    <linearGradient id="bevelRev" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7d9"/>
      <stop offset="0.45" stop-color="#d6a645"/>
      <stop offset="1" stop-color="#4f300a"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c58a2e"/>
      <stop offset="1" stop-color="#6b4310"/>
    </linearGradient>
    <!-- 볼록한 면: 가운데(왼쪽 위로 살짝 치우친 곳)는 밝고 테두리 쪽으로 둥글게 어두워진다 -->
    <radialGradient id="dome" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#fff3c8" stop-opacity="0.08"/>
      <stop offset="0.8" stop-color="#3a2205" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2e1a03" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="faceClip"><circle cx="256" cy="244" r="207"/></clipPath>
    <filter id="blur" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="262" cy="482" rx="186" ry="18" fill="#000" opacity="0.6" filter="url(#blur)"/>

  <!-- 동전 두께: 앞면보다 22px 아래. 구멍도 같이 뚫어서 구멍 안쪽 벽이 보이게 -->
  <path fill="url(#edge)" fill-rule="evenodd"
        d="M256 52 a214 214 0 1 0 0.01 0 Z M206 216 h100 v100 h-100 Z"/>

  <!-- 동전 앞면 -->
  <path fill="url(#face)" fill-rule="evenodd"
        d="M256 30 a214 214 0 1 0 0.01 0 Z M206 194 h100 v100 h-100 Z"/>

  <!-- 안쪽 바탕면을 살짝 낮게 보이게 -->
  <path fill="url(#field)" fill-rule="evenodd"
        d="M256 58 a186 186 0 1 0 0.01 0 Z M194 182 h124 v124 h-124 Z"/>

  <!-- 앞면을 살짝 통통하게: 볼록한 명암 + 테두리 안쪽 얕은 음영 -->
  <path fill="url(#dome)" fill-rule="evenodd"
        d="M256 58 a186 186 0 1 0 0.01 0 Z M194 182 h124 v124 h-124 Z"/>
  <circle cx="256" cy="244" r="183" fill="none" stroke="#2e1a03" stroke-width="10" opacity="0.18" filter="url(#soft)"/>

  <!-- 바깥 테: 그림자 → 빛 받는 면 → 가장자리 선 -->
  <circle cx="258" cy="247" r="190" fill="none" stroke="#2e1a03" stroke-width="5" opacity="0.45" filter="url(#soft)"/>
  <circle cx="256" cy="244" r="203" fill="none" stroke="url(#bevel)" stroke-width="22"/>
  <circle cx="256" cy="244" r="213" fill="none" stroke="#3a2205" stroke-width="2.5"/>
  <circle cx="256" cy="244" r="192" fill="none" stroke="url(#bevelRev)" stroke-width="3"/>
  <!-- 테두리 왼쪽 위 반사광 -->
  <path d="M86 170 A186 186 0 0 1 200 54" fill="none" stroke="#fffbe8" stroke-width="7" stroke-linecap="round" opacity="0.95" transform="translate(-10 -6)"/>
  <path d="M104 132 A186 186 0 0 1 150 84" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="translate(-14 -10)"/>
  <path d="M410 350 A186 186 0 0 1 330 420" fill="none" stroke="#ffe9a8" stroke-width="4" stroke-linecap="round" opacity="0.45" transform="translate(12 10)"/>

  <!-- 네모 구멍 둘레 돋을 테: 아래쪽 그림자 → 빛 받는 면 -->
  <rect x="196" y="186" width="124" height="124" rx="4" fill="none" stroke="#2e1a03" stroke-width="10" opacity="0.4" filter="url(#soft)"/>
  <rect x="194" y="182" width="124" height="124" rx="4" fill="none" stroke="url(#bevel)" stroke-width="14"/>
  <rect x="206" y="194" width="100" height="100" fill="none" stroke="#3a2205" stroke-width="2.5"/>

  <!-- 통화 기호: 옛 엽전 글자 ₩ 위, $ 오른쪽, ¥ 아래, € 왼쪽.
       기준선 = 중심 + 0.36em (렌더러가 세로 가운데 맞춤을 무시해서 직접 계산) -->
  <g font-family="Helvetica Neue, Arial" font-weight="800" font-size="116" text-anchor="middle">
    <g fill="#2e1a03" opacity="0.6" transform="translate(4 6)" filter="url(#soft)">
      <text x="388" y="286">$</text>
      <text x="256" y="414">¥</text>
      <text x="124" y="286">€</text>
    </g>
    <g fill="#4f300a" transform="translate(1.5 2.5)">
      <text x="388" y="286">$</text>
      <text x="256" y="414">¥</text>
      <text x="124" y="286">€</text>
    </g>
    <g fill="#fff8de" transform="translate(-1.8 -1.8)">
      <text x="388" y="286">$</text>
      <text x="256" y="414">¥</text>
      <text x="124" y="286">€</text>
    </g>
    <g fill="url(#glyph)">
      <text x="388" y="286">$</text>
      <text x="256" y="414">¥</text>
      <text x="124" y="286">€</text>
    </g>
  </g>

  <!-- 원화: 맨 위 주인공 자리. 색은 다른 기호와 같고, 약간 크게 + 더 높이 솟은 돋을새김으로 돋보이게 -->
  <g font-family="Helvetica Neue, Arial" font-weight="800" font-size="116" text-anchor="middle">
    <text x="262" y="169" fill="#2e1a03" opacity="0.7" filter="url(#soft)">₩</text>
    <text x="260" y="165.5" fill="#3f2606">₩</text>
    <text x="259.2" y="164.3" fill="#4f300a">₩</text>
    <text x="258.4" y="163.1" fill="#5e3b0c">₩</text>
    <text x="257.6" y="161.9" fill="#6b4512">₩</text>
    <text x="256.8" y="160.7" fill="#7a5216">₩</text>
    <text x="253.6" y="157.4" fill="#fffbe8">₩</text>
    <text x="256" y="160" fill="url(#glyph)">₩</text>
  </g>

  <!-- 은은한 광택 -->
  <g clip-path="url(#faceClip)">
    <ellipse cx="190" cy="110" rx="230" ry="150" fill="url(#gloss)" transform="rotate(-20 190 110)"/>
  </g>
</svg>
