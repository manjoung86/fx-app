<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdc5a"/>
      <stop offset="1" stop-color="#3f9f2a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbe9"/>
      <stop offset="1" stop-color="#d6efc2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1d4d12" flood-opacity="0.35"/>
    </filter>
    <!-- 지폐 본체 (가운데 기준 170x280) -->
    <g id="note">
      <rect x="-85" y="-140" width="170" height="280" rx="16" fill="url(#paper)" stroke="#2f7a1f" stroke-width="6"/>
      <rect x="-68" y="-123" width="136" height="246" rx="10" fill="none" stroke="#5fae45" stroke-width="4"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 원형 테두리 -->
  <circle cx="256" cy="256" r="196" fill="#4fb233" stroke="#2f7a1f" stroke-width="14"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#a8e48a" stroke-width="5"/>

  <!-- 뒤쪽 지폐: 아래 끝을 축으로 좌우로 펼치고, 기호는 위쪽에 둔다 -->
  <g transform="translate(256 296) rotate(-32 0 140)" filter="url(#shadow)">
    <use href="#note"/>
    <circle cx="0" cy="-88" r="38" fill="#ffffff" stroke="#2f7a1f" stroke-width="5"/>
    <text x="0" y="-70" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="800" font-size="50" fill="#2f7a1f">€</text>
  </g>
  <g transform="translate(256 296) rotate(32 0 140)" filter="url(#shadow)">
    <use href="#note"/>
    <circle cx="0" cy="-88" r="38" fill="#ffffff" stroke="#2f7a1f" stroke-width="5"/>
    <text x="0" y="-70" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="800" font-size="52" fill="#2f7a1f">$</text>
  </g>
  <!-- 맨 앞 지폐 (₩) -->
  <g transform="translate(256 296)" filter="url(#shadow)">
    <use href="#note"/>
    <circle cx="0" cy="-20" r="54" fill="#ffffff" stroke="#2f7a1f" stroke-width="6"/>
    <text x="0" y="2" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="800" font-size="64" fill="#2f7a1f">₩</text>
    <circle cx="-44" cy="-100" r="8" fill="#5fae45"/>
    <circle cx="44" cy="80" r="8" fill="#5fae45"/>
  </g>
</svg>
